name: template-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 產出的樣板必須與 src/ 一致，CSP hash 也必須正確。
      - run: node scripts/build-template.mjs --check
