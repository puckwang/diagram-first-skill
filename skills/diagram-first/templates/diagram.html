<!doctype html>
<!--
  diagram-first HTML 樣板

  使用方式（Agent 直接編輯文字，不執行任何程式）：
  1. 替換 {{LANG}}：使用者語言的 BCP 47 代碼，例如 zh-Hant-TW、en、ja。介面文字會依此切換。
     只能包含英數字與 -（此處在 CSP 生效之前）。
  2. 替換 {{TITLE}} 與 {{SUMMARY}}：頁面標題與一句話摘要，使用使用者的語言。
  3. 每張圖複製一個 <section class="diagram">…</section>，填入：
     - {{DIAGRAM_TITLE}}：這張圖的標題
     - {{DIAGRAM_CAPTION}}：一句話結論（約 30 字以內），例如「付款失敗一律釋放庫存」
     - {{MERMAID_SOURCE}}：Mermaid 原始碼，貼在 <script type="text/plain"> 內，縮排不影響結果
     - {{LEGEND}}：圖例，預設不寫，刪除整個 <div class="legend">；只在有縮寫、代號或非補充不可的節點時加，
       最多 5 條、每條一行（見 references/mermaid-guide.md 2.6）。頁面上預設收合。
  4. 刪除所有尚未替換的 {{…}} 佔位符與本段註解。
  5. Mermaid 原始碼中不可出現字串 </script，必要時改寫標籤。

  不要修改 <script type="module"> 內的程式、版本號與 CSP。
  CSP 只允許兩種 script：下方 <script type="module"> 的內容（以 sha256 比對，改動任何字元就無法執行），
  以及 jsDelivr 上的 mermaid@12.1.0。

  頁面為單圖檢視：一次顯示一張圖並撐滿視窗、自動符合大小，其餘介面都由程式產生並浮在圖上：
  - 左上：目錄（依各圖 <h2> 產生）。兩張圖以上時可用下拉清單、‹ ›、鍵盤 ←／→（焦點不在畫布時）或 PageUp／PageDown 切換，
    網址同步為 #diagram-N。
  - 右上：說明視窗開關、⚙ 設定（模式、方向、Theme，存在 localStorage）、全螢幕（瀏覽器不支援時不顯示）。
  - 說明視窗：預設收合成左上小卡（目前這張圖的標題與一句話結論）；展開後顯示頁面標題、摘要、圖例與原始碼；
    展開狀態存在 localStorage。
  - 下方工具列：縮放、重設（符合視窗）、個別方向；⋯ 選單內有下載 SVG／PNG／JPEG／WebP、複製圖片與原始碼。
  方向只影響 flowchart、state、class、ER、requirement；「自動」依視窗方向，橫向時轉為水平、直向時轉為垂直。
  自動符合大小最多放大到 150%，並避開小卡或寬螢幕上展開的說明視窗（取其右側或下方較大的區域）。
  個別方向選單（跟隨頁面／垂直／水平）只在本次瀏覽有效，不存 localStorage。
  整個視窗是無限畫布（淡點陣背景）：任何縮放狀態都可用滑鼠、觸控筆或手指拖曳平移，圖至少保留 48px 在畫面內。
  觸控板雙指平移、捏合縮放；滑鼠滾輪縮放、Shift＋滾輪水平平移；觸控螢幕兩指捏合縮放。
  畫布取得焦點時：方向鍵平移、+／− 縮放、0 符合視窗、1 原始大小；PageUp／PageDown 切換圖。列印時改為逐張排列。
  Theme 預設為「自動」：淺色模式用 redux-color，深色模式用 redux-dark-color。
  Mermaid 原始碼的 front matter 不可指定 theme，否則會蓋過使用者的選擇。

  Mermaid 12.1.0 的完整版內建 ELK，並以 ELK 作為適用圖種的預設排版。
  不在 initialize 中全域設定 layout：mindmap 等圖種使用自己的排版引擎，全域指定 ELK 會讓它們 render 失敗。
  需要指定排版時，寫在各圖原始碼開頭的 front matter。
-->
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-2SU0VtitZnqtjBrff2HHfGjrKWGmawUm4C6gFVbOy3c=' https://cdn.jsdelivr.net/npm/mermaid@12.1.0/; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #F7F7F8; --surface: #FFFFFF; --text: #1F2328; --muted: #59636E;
    --border: #D1D9E0; --control: #EFF2F5; --control-text: #1F2328; --control-active: #FFFFFF;
    --danger: #A32D2D; --danger-bg: #FCEBEB; --warn: #854F0B; --warn-bg: #FAEEDA;
    --canvas-light: #FAFAFA; --canvas-dark: #1B1B1F;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Hiragino Sans", "Noto Sans TC", "Noto Sans JP", "Microsoft JhengHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151518; --surface: #1F1F23; --text: #E8E8EA; --muted: #A0A0A8;
      --border: #3A3A40; --control: #2A2A2F; --control-text: #E8E8EA; --control-active: #44444B;
      --danger: #F7C1C1; --danger-bg: #501313; --warn: #FAC775; --warn-bg: #412402;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151518; --surface: #1F1F23; --text: #E8E8EA; --muted: #A0A0A8;
    --border: #3A3A40; --control: #2A2A2F; --control-text: #E8E8EA; --control-active: #44444B;
    --danger: #F7C1C1; --danger-bg: #501313; --warn: #FAC775; --warn-bg: #412402;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 var(--font); }
  .page { padding: 32px 24px 64px; }
  header .summary, .caption, .legend { max-width: 80ch; }
  header h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  header .summary { color: var(--muted); margin: 0; }
  #status { margin: 0 0 24px; padding: 10px 14px; border-radius: 8px; font-size: 14px; display: none; }
  #status.show { display: block; }
  #status.warn { background: var(--warn-bg); color: var(--warn); }
  #status.error { background: var(--danger-bg); color: var(--danger); }
  .diagram { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin: 0 0 24px; }
  .diagram h2 { font-size: 18px; font-weight: 600; margin: 0 0 2px; }
  .caption { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 0 0 12px; }
  .toolbar button, .toolbar select, .float button, .controls select {
    font: 13px var(--font); color: var(--control-text); background: var(--control); border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .toolbar button:hover, .float button:hover { opacity: .85; }
  .toolbar .zoom { display: inline-flex; gap: 2px; }
  .toolbar .zoom .level { min-width: 56px; font-variant-numeric: tabular-nums; }
  .segmented { display: inline-flex; background: var(--control); border-radius: 6px; padding: 2px; }
  .segmented button { background: transparent; border-radius: 4px; padding: 3px 10px; }
  .segmented button[aria-pressed="true"] { background: var(--control-active); box-shadow: 0 0 0 1px var(--border); }
  .canvas { overflow: auto; border-radius: 8px; padding: 12px; background: var(--canvas-light); touch-action: pan-x pan-y pinch-zoom; }
  .canvas.dark { background: var(--canvas-dark); }
  .canvas.dragging { cursor: grabbing; user-select: none; }
  .canvas svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
  .legend { margin: 12px 0 0; font-size: 14px; color: var(--muted); }
  .legend ul { margin: 0; padding-left: 20px; }
  details.legend-box .legend { margin: 8px 0 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .err { background: var(--danger-bg); color: var(--danger); border-radius: 8px; padding: 12px 14px; font-size: 14px; }
  .err pre, details pre { font: 13px/1.5 var(--mono); white-space: pre-wrap; margin: 8px 0 0; }
  details { margin: 12px 0 0; font-size: 14px; }
  details summary { cursor: pointer; color: var(--muted); }
  details pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text); max-height: 40vh; overflow: auto; }
  .float, .pop { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 4px 16px rgba(0, 0, 0, .14); }
  .pop[hidden] { display: none; }
  :where(.toolbar, .float, .controls, .menu) :where(button, select) { min-block-size: 24px; min-inline-size: 24px; }
  @media (pointer: coarse) { :where(.toolbar, .float, .controls, .menu) :where(button, select) { min-block-size: 44px; min-inline-size: 44px; } }
  :where(.toolbar, .float, .controls, #info) :where(button, select, summary):focus-visible, .canvas:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  /* 單圖檢視：一次顯示一張圖並撐滿視窗，其餘介面浮在圖上。程式載入 Mermaid 後才加上 .app；列印時改回逐張排列。 */
  @media screen {
    html.app, html.app body { height: 100%; overflow: hidden; }
    html.app .page { padding: 0; }
    html.app main { position: fixed; inset: 0; }
    html.app section.diagram { display: none; position: absolute; inset: 0; margin: 0; padding: 0; border: 0; border-radius: 0; background: none; }
    html.app section.diagram.active { display: block; }
    #info[hidden] { display: none; }
    html.app section.diagram > .notes { display: none; }
    /* 標題只在視覺上隱藏（目錄按鈕已顯示），螢幕閱讀器仍可讀到。 */
    html.app section.diagram > h2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    /* 無限畫布：整個視窗都可拖曳平移，圖以 translate 定位；縮放改 SVG 的寬高，文字維持向量清晰。 */
    html.app .canvas { position: absolute; inset: 0; border-radius: 0; padding: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
                       --dot: rgba(0, 0, 0, .13);
                       background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.25px);
                       background-size: var(--grid, 24px) var(--grid, 24px); background-position: var(--gx, 0) var(--gy, 0); }
    html.app .canvas.dark { --dot: rgba(255, 255, 255, .11); }
    html.app .canvas.ready { cursor: grab; }
    html.app .canvas.dragging { cursor: grabbing; }
    html.app .canvas svg { position: absolute; left: 0; top: 0; margin: 0; max-width: none; transform-origin: 0 0; will-change: transform; }
    html.app .canvas > .err { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); cursor: auto; touch-action: auto; user-select: text; -webkit-user-select: text;
                              width: max-content; max-width: min(720px, calc(100% - 32px)); max-height: 60vh; overflow: auto; }
    @media (prefers-contrast: more) { html.app .canvas { background-image: none; } }
    html.app .toolbar { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20;
                        margin: 0; padding: 6px; width: max-content; max-width: calc(100vw - 24px); justify-content: center;
                        background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 4px 16px rgba(0, 0, 0, .14); }
    html.app #status { position: fixed; top: calc(var(--top-h, 48px) + 12px); left: 50%; transform: translateX(-50%); z-index: 40; margin: 0; width: max-content; max-width: calc(100vw - 24px); }
    #nav, #actions { position: fixed; top: max(12px, env(safe-area-inset-top)); z-index: 30; display: flex; gap: 4px; align-items: center; padding: 4px; }
    #nav { left: max(12px, env(safe-area-inset-left)); max-width: calc(100vw - var(--actions-w, 150px) - 36px); }
    #actions { right: max(12px, env(safe-area-inset-right)); }
    #nav .toc-btn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
    #nav > div, #actions > div { position: relative; min-width: 0; display: flex; }
    /* 彈出面板用 Popover API（頂層、點外面或 Esc 關閉）；位置由程式依觸發按鈕設定，不支援 Popover API 時同樣適用。 */
    .pop { position: fixed; inset: auto; margin: 0; top: var(--pop-top, 56px); left: var(--pop-left, auto); right: var(--pop-right, auto); bottom: var(--pop-bottom, auto);
           z-index: 35; padding: 6px 0; max-height: min(70vh, var(--pop-max-h, 70vh)); max-width: calc(100vw - 24px); overflow: auto; color: var(--text); }
    #toc-panel { min-width: 240px; max-width: min(360px, calc(100vw - 24px)); }
    #settings { padding: 10px; }
    .menu { padding: 6px; min-width: 200px; }
    .menu button { display: block; width: 100%; text-align: start; font: 14px var(--font); color: var(--control-text); background: transparent;
                   border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
    .menu button:hover, .menu button:focus-visible { background: var(--control); }
    .menu button[hidden] { display: none; }
    .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bottom-h, 52px) + 24px); z-index: 40;
             margin: 0; padding: 6px 14px; font-size: 13px; }
    /* 提示區域保持在無障礙樹中，沒有內容時只在視覺上隱藏，讓螢幕閱讀器穩定讀出。 */
    .toast:empty { opacity: 0; padding: 0; border-color: transparent; box-shadow: none; pointer-events: none; }
    .toc ol { list-style: none; margin: 0; padding: 0; }
    .toc a { display: block; padding: 4px 12px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; font-size: 14px; }
    .toc a:hover { color: var(--text); background: var(--control); }
    .toc a[aria-current="true"] { color: var(--text); border-left-color: var(--text); font-weight: 600; }
    .controls { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    #info { position: fixed; top: calc(var(--top-h, 48px) + 12px); left: max(12px, env(safe-area-inset-left)); z-index: 25; width: min(380px, calc(100vw - 24px));
            cursor: auto;
            max-height: calc(100dvh - var(--top-h, 48px) - var(--bottom-h, 52px) - 36px); overflow: auto; padding: 12px 16px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 4px 16px rgba(0, 0, 0, .14); }
    #info header h1 { font-size: 16px; margin: 0 28px 2px 0; line-height: 1.4; }
    #info header .summary { font-size: 14px; }
    /* 小卡：預設只顯示目前這張圖的標題與一句話結論，點「展開說明」才顯示完整內容；小卡以外的區域都交給畫布。 */
    #info.card { width: auto; max-width: min(320px, calc(100vw - 24px)); padding: 8px 12px; }
    #info.card > header, #info.card .notes details, #info.card .close { display: none; }
    #info.card .notes { border-top: 0; margin: 0; padding: 0; }
    #info:not(.card) .expand { display: none; }
    #info .expand { margin: 6px 0 0; font: 13px var(--font); color: var(--control-text); background: var(--control); border: 0; border-radius: 6px; padding: 2px 10px; cursor: pointer; }
    #info .notes { border-top: 1px solid var(--border); margin: 10px 0 0; padding: 10px 0 0; }
    #info .notes h3 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
    #info .caption { margin: 0; }
    #info .close { position: absolute; top: 8px; right: 8px; font: 13px var(--font); color: var(--control-text); background: var(--control); border: 0; border-radius: 6px; padding: 0 8px; cursor: pointer; }
  }
  @media print {
    #info .notes, .notes h3 { display: none; }
    #info[hidden] { display: block !important; }
    .toolbar, .float, .pop, .close { display: none !important; }
    .canvas { background-image: none !important; }
    .canvas svg { position: static !important; transform: none !important; max-width: 100% !important; width: auto !important; height: auto !important; }
    #info .expand { display: none; }
    section.diagram { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>{{TITLE}}</h1>
    <p class="summary">{{SUMMARY}}</p>
  </header>
  <div class="controls" id="controls"></div>
  <div id="status" role="status"></div>
  <main>

    <section class="diagram">
      <h2>{{DIAGRAM_TITLE}}</h2>
      <p class="caption">{{DIAGRAM_CAPTION}}</p>
      <script type="text/plain" class="mermaid-src">
{{MERMAID_SOURCE}}
      </script>
      <div class="legend">{{LEGEND}}</div>
    </section>

  </main>
</div>

<script type="module">

    const up = align === 'up';
    prop('--pop-top', up ? 'auto' : `${Math.round(r.bottom + 8)}px`);
    prop('--pop-bottom', up ? `${Math.round(innerHeight - r.top + 8)}px` : 'auto');
    prop('--pop-max-h', `${Math.max(120, Math.round(up ? r.top - 16 : innerHeight - r.bottom - 16))}px`);
    const end = align === 'right' || up;
    prop('--pop-right', end ? `${Math.max(12, Math.round(innerWidth - r.right))}px` : 'auto');
    prop('--pop-left', end ? 'auto' : `${Math.max(12, Math.round(r.left))}px`);
  };
  // 開啟後若超出視窗左右邊緣，改貼齊該側。
  const clamp = () => {
    const m = panel.getBoundingClientRect();
    if (m.left < 12) { prop('--pop-right', 'auto'); prop('--pop-left', '12px'); }
    else if (m.right > innerWidth - 12) { prop('--pop-left', 'auto'); prop('--pop-right', '12px'); }
  };
  let set;
  if (nativePopover) {
    panel.setAttribute('popover', 'auto');
    btn.setAttribute('popovertarget', panel.id);
    panel.addEventListener('beforetoggle', (e) => { if (e.newState === 'open') place(); });
    panel.addEventListener('toggle', (e) => {
      btn.setAttribute('aria-expanded', String(e.newState === 'open'));
      if (e.newState === 'open') { clamp(); onOpen?.(); }
    });
    set = (v) => {
      const open = panel.matches(':popover-open');
      if (v && !open) panel.showPopover();
      if (!v && open) panel.hidePopover();
    };
  } else {
    panel.hidden = true;
    set = (v) => {
      if (v) place();
      panel.hidden = !v;
      btn.setAttribute('aria-expanded', String(v));
      if (v) { clamp(); onOpen?.(); }
    };
    btn.addEventListener('click', () => {
      const v = panel.hidden;
      popovers.forEach((p) => p.set(false));
      set(v);
    });
  }
  const p = { btn, panel, set, isOpen: () => (nativePopover ? panel.matches(':popover-open') : !panel.hidden) };
  popovers.push(p);
  return p;
}
if (!nativePopover) {
  document.addEventListener('click', (e) => {
    popovers.forEach((p) => { if (p.isOpen() && !p.btn.contains(e.target) && !p.panel.contains(e.target)) p.set(false); });
  });
}

// 下拉選單：開啟時聚焦第一項，↑／↓／Home／End 移動，Tab 離開時關閉。
function menuKeys(menu, p) {
  const items = () => [...menu.querySelectorAll('[role="menuitem"]')].filter((x) => !x.hidden);
  menu.addEventListener('keydown', (e) => {
    const list = items();
    const k = list.indexOf(document.activeElement);
    if (k < 0 && e.key === 'ArrowUp') { e.preventDefault(); list[list.length - 1]?.focus(); return; }
    const next = { ArrowDown: list[(k + 1) % list.length], ArrowUp: list[(k - 1 + list.length) % list.length],
                   Home: list[0], End: list[list.length - 1] }[e.key];
    if (next) { e.preventDefault(); next.focus(); }
    if (e.key === 'Tab') {
      p.set(false);
      // 不支援 Popover API 時，關閉後焦點不會自動回到按鈕，先移回再讓 Tab 繼續。
      if (!nativePopover) p.btn.focus();
    }
  });
  return () => items()[0]?.focus();
}

// 操作結果提示（複製、匯出），同時供螢幕閱讀器讀出。
const toast = el('p', { class: 'toast float', role: 'status' });
let toastTimer = 0;
function notify(text) {
  // 先清空再寫入，連續相同的訊息也會再讀一次。
  toast.textContent = '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.textContent = text;
    toastTimer = setTimeout(() => { toast.textContent = ''; }, 2000);
  }, 50);
}

const diagrams = [];
let badCount = 0;
const sections = [...document.querySelectorAll('section.diagram')];
document.documentElement.classList.add('app');

// 說明視窗：頁面標題與摘要，加上目前這張圖的標題、一句話結論、圖例與原始碼。
const page = document.querySelector('.page');
const info = el('aside', { id: 'info', 'aria-label': T.info });
const closeInfo = el('button', { type: 'button', class: 'close', 'aria-label': T.close, title: T.close }, '×');
const expandInfo = el('button', { type: 'button', class: 'expand', 'aria-expanded': 'false', 'aria-controls': 'info' }, T.expand);
info.append(closeInfo);
document.body.append(el('p', { id: 'canvas-hint', class: 'sr-only' }, T.hint));
const headerEl = document.querySelector('header');
if (headerEl) info.append(headerEl);
page.prepend(info);
const notes = new Map();

for (const [i, section] of sections.entries()) {
  if (!section.id) section.id = `diagram-${i + 1}`;
  const title = section.querySelector('h2')?.textContent.trim() || `#${i + 1}`;
  section.dataset.title = title;
  const note = el('div', { class: 'notes' });
  note.append(el('h3', {}, title));
  const caption = section.querySelector('.caption');
  if (caption) note.append(caption);
  notes.set(section, note);
  section.append(note);

  const srcNode = section.querySelector('script.mermaid-src');
  if (!srcNode) continue;
  const source = dedent(srcNode.textContent);

  const toolbar = el('div', { class: 'toolbar', role: 'toolbar', 'aria-label': title });
  const canvas = el('div', { class: 'canvas', role: 'region', 'aria-label': title, 'aria-describedby': 'canvas-hint', tabindex: '0' });
  const details = el('details');
  const pre = el('pre', { tabindex: '0' });
  pre.append(el('code', {}, source));
  details.append(el('summary', {}, T.source), pre);
  srcNode.after(canvas, toolbar);
  const legend = section.querySelector('.legend');
  if (legend) {
    const items = legend.querySelectorAll('li').length;
    const box = el('details', { class: 'legend-box', open: '' });
    box.append(el('summary', {}, items ? `${T.legend} (${items})` : T.legend), legend);
    note.append(box);
  }
  note.append(details);

  // ⋯ 選單：下載、複製圖片、複製原始碼。
  const moreBtn = el('button', { type: 'button', 'aria-label': T.more, title: T.more, 'aria-haspopup': 'menu', 'aria-controls': `more-${i + 1}` }, '⋯');
  const menu = el('div', { class: 'pop menu', id: `more-${i + 1}`, role: 'menu', 'aria-label': T.more });
  toolbar.append(moreBtn);
  document.body.append(menu);
  let focusFirst = () => {};
  const more = popover(moreBtn, menu, 'up', () => focusFirst());
  focusFirst = menuKeys(menu, more);
  const menuItem = (label, run) => {
    const b = el('button', { type: 'button', role: 'menuitem', tabindex: '-1' }, label);
    b.addEventListener('click', async () => {
      more.set(false);
      moreBtn.focus();
      await run();
    });
    menu.append(b);
    return b;
  };
  menuItem(T.copy, async () => {
    try {
      await navigator.clipboard.writeText(source);
      notify(T.copied);
    } catch {
      notify(T.copyFail);
      details.open = true;
      showInfo(true);
    }
  });
  const syncToolbar = rovingToolbar(toolbar);

  try {
    await mermaid.parse(source);
  } catch (e) {
    badCount++;
    const box = el('div', { class: 'err' }, T.parseFail);
    box.append(el('pre', {}, String(e.message || e)));
    canvas.append(box);
    details.open = true;
    continue;
  }

  const d = { i, section, source, canvas, details, toolbar, ok: false, svg: '', scale: 1, tx: 0, ty: 0,
              direction: 'page', fit: true, syncToolbar };
  const download = async (v) => {
    const name = `diagram-${i + 1}`;
    try {
      if (v === 'svg') saveBlob(new Blob([d.svg], { type: 'image/svg+xml' }), `${name}.svg`);
      else {
        const type = v === 'png-transparent' ? 'image/png' : `image/${v}`;
        const ext = v === 'jpeg' ? 'jpg' : v === 'png-transparent' ? 'png' : v;
        saveBlob(await exportImage(d, type, v === 'png-transparent'), `${name}.${ext}`);
      }
    } catch {
      notify(T.exportFail);
    }
  };
  const copyImage = async () => {
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': exportImage(d, 'image/png', false) })]);
      notify(T.copied);
    } catch {
      notify(T.copyFail);
    }
  };
  // 圖片相關項目放在原始碼之前；render 失敗時隱藏。
  d.imageItems = [...FORMATS.map(([v, label]) => menuItem(T.downloadAs(label || T.transparent), () => download(v))),
                  menuItem(T.copyImage, copyImage)];
  menu.prepend(...d.imageItems);
  d.imageItems.forEach((b) => { b.hidden = true; });
  const zoom = el('div', { class: 'zoom', role: 'group' });
  const outBtn = el('button', { type: 'button', 'aria-label': T.zoomOut, title: T.zoomOut }, '−');
  d.level = el('button', { type: 'button', class: 'level', title: T.zoomActual }, '');
  const inBtn = el('button', { type: 'button', 'aria-label': T.zoomIn, title: T.zoomIn }, '+');
  const resetBtn = el('button', { type: 'button' }, T.reset);
  outBtn.addEventListener('click', () => setZoom(d, currentScale(d) / ZOOM.step));
  inBtn.addEventListener('click', () => setZoom(d, currentScale(d) * ZOOM.step));
  d.level.addEventListener('click', () => setZoom(d, 1));
  resetBtn.addEventListener('click', () => fitScreen(d));
  zoom.append(outBtn, d.level, inBtn);
  d.buttons = [zoom, resetBtn];
  if (isDirected(source)) {
    const dirSelect = el('select', { 'aria-label': T.direction, title: T.direction });
    [['page', T.followPage], ['vertical', T.vertical], ['horizontal', T.horizontal]]
      .forEach(([v, label]) => dirSelect.append(el('option', { value: v }, label)));
    dirSelect.addEventListener('change', async () => {
      d.direction = dirSelect.value;
      // 方向改變後圖的尺寸不同，舊倍率不再適用，重新符合視窗。
      d.fit = true;
      await renderOne(d);
    });
    d.buttons.push(dirSelect);
  }
  bindGestures(d);
  diagrams.push(d);
}

// 每張圖的方向：「跟隨頁面」時用頁首的方向設定。
function dirOf(d) {
  return d.direction === 'page' ? direction : d.direction;
}

let renderCount = 0;
async function renderOne(d) {
  const n = ++renderCount;
  d.canvas.classList.toggle('dark', currentTheme().includes('dark'));
  try {
    const source = withDirection(d.source, dirOf(d));
    let svg;
    try {
      ({ svg } = await mermaid.render(`diagram-${d.i}-${n}`, source));
    } catch (e) {
      if (source === d.source) throw e;
      ({ svg } = await mermaid.render(`diagram-${d.i}-${n}-src`, d.source));
    }
    d.canvas.innerHTML = svg;
    // 從 DOM 序列化成合法的 XML：Mermaid 的 HTML 標籤（例如 <br>）不一定是自我封閉，直接當 XML 解析會失敗。
    d.svg = new XMLSerializer().serializeToString(d.canvas.querySelector('svg'));
    if (!d.ok) { d.toolbar.prepend(...d.buttons); d.syncToolbar(); }
    d.imageItems.forEach((b) => { b.hidden = false; });
    d.ok = true;
    d.canvas.classList.add('ready');
    if (d.fit) fitScreen(d);
    else applyView(d);
  } catch (e) {
    const box = el('div', { class: 'err' }, T.renderFail);
    box.append(el('pre', {}, String(e.message || e)));
    d.canvas.replaceChildren(box);
    d.buttons.forEach((b) => b.remove());
    d.imageItems.forEach((b) => { b.hidden = true; });
    d.syncToolbar();
    d.ok = false;
    d.canvas.classList.remove('ready', 'dragging');
    d.details.open = true;
  }
}
// filter 為 null 時重繪全部；否則只重繪符合條件的圖。
async function renderAll(filter = null) {
  initMermaid();
  for (const d of diagrams) {
    if (!filter || filter(d)) await renderOne(d);
  }
}
const followsPage = (d) => d.direction === 'page';

// 右上角：說明、設定、全螢幕。
const actions = el('div', { id: 'actions', class: 'float' });
const infoBtn = el('button', { type: 'button', 'aria-label': T.info, title: T.info, 'aria-controls': 'info' }, `ⓘ ${T.info}`);
// v 為 true 時展開完整說明；false 時收合成只有標題與一句話結論的小卡，圖是主角。
function showInfo(v, remember = true) {
  info.classList.toggle('card', !v);
  infoBtn.setAttribute('aria-pressed', String(v));
  expandInfo.setAttribute('aria-expanded', String(v));
  if (remember) save(STORE.info, v ? 'open' : 'closed');
  // 只重新符合仍在 fit 狀態的圖；使用者已手動平移或縮放的圖不動，避免跳動。
  diagrams.forEach((d) => { if (d.ok && d.fit) requestAnimationFrame(() => fitScreen(d)); });
}
const isOpen = () => !info.classList.contains('card');
infoBtn.addEventListener('click', () => showInfo(!isOpen()));
closeInfo.addEventListener('click', () => { showInfo(false); infoBtn.focus(); });
expandInfo.addEventListener('click', () => { showInfo(true); closeInfo.focus(); });
// 預設收合成小卡，畫布幾乎整個可見。
showInfo(load(STORE.info, ['open', 'closed'], 'closed') === 'open', false);
const settingsWrap = el('div');
const settingsBtn = el('button', { type: 'button', 'aria-label': T.settings, title: T.settings, 'aria-controls': 'settings' }, '⚙');
const settings = el('div', { class: 'pop', id: 'settings', role: 'group', 'aria-label': T.settings });
const controls = document.getElementById('controls') || el('div', { class: 'controls' });
settings.append(controls);
settingsWrap.append(settingsBtn, settings);
popover(settingsBtn, settings, 'right');
actions.append(infoBtn, settingsWrap);
if (fsEnabled) {
  const fsBtn = el('button', { type: 'button', 'aria-pressed': 'false' }, T.fullscreen);
  fsBtn.addEventListener('click', toggleFullscreen);
  const sync = () => {
    const on = Boolean(fsElement());
    fsBtn.textContent = on ? T.exitFullscreen : T.fullscreen;
    fsBtn.setAttribute('aria-pressed', String(on));
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
  actions.append(fsBtn);
}

const modeGroup = el('div', { class: 'segmented', role: 'group', 'aria-label': T.mode });
const modeButtons = ['auto', 'light', 'dark'].map((m) => {
  const b = el('button', { type: 'button', 'aria-pressed': String(m === mode) }, T[m]);
  b.addEventListener('click', async () => {
    mode = m;
    save(STORE.mode, m);
    modeButtons.forEach((x, k) => x.setAttribute('aria-pressed', String(['auto', 'light', 'dark'][k] === m)));
    applyMode();
    if (theme === 'auto') await renderAll();
  });
  return b;
});
modeGroup.append(...modeButtons);
const themeSelect = el('select', { 'aria-label': T.theme });
themeSelect.append(el('option', { value: 'auto' }, `${T.auto} (${AUTO_THEME.light} / ${AUTO_THEME.dark})`));
THEMES.forEach((t) => themeSelect.append(el('option', { value: t }, t)));
themeSelect.value = theme;
themeSelect.addEventListener('change', async () => {
  theme = themeSelect.value;
  save(STORE.theme, theme);
  await renderAll();
});
const DIRECTIONS = ['auto', 'vertical', 'horizontal'];
const directionGroup = el('div', { class: 'segmented', role: 'group', 'aria-label': T.direction });
const directionButtons = DIRECTIONS.map((v) => {
  const b = el('button', { type: 'button', 'aria-pressed': String(v === direction) }, T[v]);
  b.addEventListener('click', async () => {
    direction = v;
    save(STORE.direction, v);
    directionButtons.forEach((x, k) => x.setAttribute('aria-pressed', String(DIRECTIONS[k] === v)));
    diagrams.forEach((d) => { if (followsPage(d)) d.fit = true; });
    await renderAll(followsPage);
  });
  return b;
});
directionGroup.append(...directionButtons);
controls.append(modeGroup, directionGroup, themeSelect);

// 左上角：目錄切換。兩張圖以上才有清單與上一張／下一張。
const nav = el('nav', { id: 'nav', class: 'float toc', 'aria-label': T.toc });
const tocWrap = el('div');
const tocBtn = el('button', { type: 'button', class: 'toc-btn', 'aria-controls': 'toc-panel' });
tocWrap.append(tocBtn);
nav.append(tocWrap);
const links = new Map();
let current = 0;
const multi = sections.length >= 2;
const prevBtn = el('button', { type: 'button', 'aria-label': T.prev, title: T.prev }, '‹');
const nextBtn = el('button', { type: 'button', 'aria-label': T.next, title: T.next }, '›');
if (multi) {
  const panel = el('div', { class: 'pop', id: 'toc-panel' });
  const list = el('ol');
  sections.forEach((section) => {
    const a = el('a', { href: `#${section.id}` }, section.dataset.title);
    links.set(section, a);
    const li = el('li');
    li.append(a);
    list.append(li);
  });
  panel.append(list);
  tocWrap.append(panel);
  const toc = popover(tocBtn, panel);
  list.addEventListener('click', (e) => {
    const a = e.target.closest('a');
    if (!a) return;
    e.preventDefault();
    toc.set(false);
    show(sections.findIndex((x) => `#${x.id}` === a.getAttribute('href')));
  });
  prevBtn.addEventListener('click', () => show(current - 1));
  nextBtn.addEventListener('click', () => show(current + 1));
  nav.append(prevBtn, nextBtn);
} else {
  tocBtn.disabled = true;
}
document.body.append(nav, actions, toast);

// 切換到第 k 張圖：顯示該圖、把它的說明移入說明視窗，並同步網址的 #id。
function show(k, updateHash = true) {
  popovers.forEach((p) => p.set(false));
  if (!sections.length) return;
  current = (k + sections.length) % sections.length;
  const section = sections[current];
  sections.forEach((x) => x.classList.toggle('active', x === section));
  info.querySelectorAll('.notes').forEach((n) => n.remove());
  info.append(notes.get(section), expandInfo);
  tocBtn.textContent = multi ? `☰ ${section.dataset.title}  ${current + 1}/${sections.length} ▾` : section.dataset.title;
  links.forEach((a, x) => a.setAttribute('aria-current', String(x === section)));
  if (updateHash && location.hash !== `#${section.id}`) history.replaceState(null, '', `#${section.id}`);
  const d = diagrams.find((x) => x.section === section);
  if (d && d.ok) requestAnimationFrame(() => (d.fit ? fitScreen(d) : applyView(d)));
}
const fromHash = () => {
  let hash = location.hash;
  try { hash = decodeURIComponent(hash); } catch {}
  return Math.max(0, sections.findIndex((x) => `#${x.id}` === hash));
};
addEventListener('hashchange', () => show(fromHash(), false));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !nativePopover) {
    popovers.forEach((p) => { if (p.isOpen()) { p.set(false); p.btn.focus(); } });
    return;
  }
  if (!multi || e.altKey || e.ctrlKey || e.metaKey) return;
  // PageUp／PageDown 在頁面與畫布上都能切換；←／→ 只在焦點不在畫布、原始碼與工具列時切換（畫布上用來平移）。
  const t = e.target;
  const onCanvas = t.classList?.contains('canvas');
  const free = t === document.body || t === document.documentElement || t.closest('#nav');
  const paging = e.key === 'PageUp' || e.key === 'PageDown';
  if (!(free || (paging && onCanvas))) return;
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(current - 1); }
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); show(current + 1); }
});
// 列印時把各圖的說明放回原位，逐張印出。
addEventListener('beforeprint', () => notes.forEach((n, section) => section.append(n)));
addEventListener('afterprint', () => show(current, false));
// 依浮動列的實際高度與寬度保留畫布空間（手機上工具列可能換行）。
const root = document.documentElement;
const measure = () => {
  const toolbars = diagrams.map((d) => d.toolbar).concat([...document.querySelectorAll('section.active .toolbar')]);
  root.style.setProperty('--top-h', `${Math.ceil(Math.max(nav.offsetHeight, actions.offsetHeight))}px`);
  root.style.setProperty('--actions-w', `${Math.ceil(actions.offsetWidth)}px`);
  root.style.setProperty('--bottom-h', `${Math.ceil(Math.max(0, ...toolbars.map((x) => x.offsetHeight)))}px`);
  diagrams.forEach((d) => { if (d.ok && d.fit) fitScreen(d); });
};
const bars = new ResizeObserver(() => requestAnimationFrame(measure));
[nav, actions, info, ...document.querySelectorAll('.toolbar')].forEach((x) => bars.observe(x));
show(fromHash());

systemDark.addEventListener('change', async () => {
  if (mode === 'auto' && theme === 'auto') await renderAll();
});
landscape.addEventListener('change', async () => {
  const auto = (d) => dirOf(d) === 'auto';
  diagrams.forEach((d) => { if (auto(d)) d.fit = true; });
  await renderAll(auto);
});
let resizeFrame = 0;
addEventListener('resize', () => {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => diagrams.forEach((d) => {
    if (d.fit) fitScreen(d);
    else applyView(d);
  }));
});

await renderAll();
badCount += diagrams.filter((d) => !d.ok).length;

if (badCount) {
  setStatus('error', T.some(diagrams.filter((d) => d.ok).length, badCount));
} else if (!(await elkIsActive(mermaid))) {
  setStatus('warn', T.noElk);
}
</script>
</body>
</html>
