<!doctype html>
<!--
  diagram-first HTML 樣板

  使用方式（Agent 直接編輯文字，不執行任何程式）：
  1. 替換 {{LANG}}：使用者語言的 BCP 47 代碼，例如 zh-Hant-TW、en、ja。介面文字會依此切換。
     只能包含英數字與 -（此處在 CSP 生效之前）。
  2. 替換 {{TITLE}} 與 {{SUMMARY}}：頁面標題與一句話摘要，使用使用者的語言。
  3. 每張圖複製一個 <section class="diagram">…</section>，填入：
     - {{DIAGRAM_TITLE}}：這張圖的標題
     - {{DIAGRAM_CAPTION}}：一句話結論（約 30 字以內），例如「付款失敗一律釋放庫存」
     - {{MERMAID_SOURCE}}：Mermaid 原始碼，貼在 <script type="text/plain"> 內，縮排不影響結果
     - {{LEGEND}}：圖例，預設不寫，刪除整個 <div class="legend">；只在有縮寫、代號或非補充不可的節點時加，
       最多 5 條、每條一行（見 references/mermaid-guide.md 2.6）。頁面上預設收合。
  4. 刪除所有尚未替換的 {{…}} 佔位符與本段註解。
  5. Mermaid 原始碼中不可出現字串 </script，必要時改寫標籤。

  不要修改 <script type="module"> 內的程式、版本號與 CSP。
  CSP 只允許兩種 script：下方 <script type="module"> 的內容（以 sha256 比對，改動任何字元就無法執行），
  以及 jsDelivr 上的 mermaid@12.1.0。

  標題與描述下方的模式（自動／淺色／深色）、方向（自動／垂直／水平）與 Theme 選單由程式產生，使用者的選擇存在 localStorage。
  方向只影響 flowchart、state、class、ER、requirement；「自動」在橫向視窗把垂直的圖改為水平，作者寫明 LR／RL 的圖不改。
  每張圖的工具列有縮放按鈕；畫布內可用 Ctrl／⌘＋滾輪或觸控板捏合縮放、拖曳平移。
  頁首另有寬度切換（寬版／標準，預設寬版）；工具列可下載 SVG／PNG／JPEG／WebP 或複製圖片。
  兩張圖以上時，程式依各圖的 <h2> 自動產生目錄，Agent 不需另寫。
  Theme 預設為「自動」：淺色模式用 redux-color，深色模式用 redux-dark-color。
  Mermaid 原始碼的 front matter 不可指定 theme，否則會蓋過使用者的選擇。

  Mermaid 12.1.0 的完整版內建 ELK，並以 ELK 作為適用圖種的預設排版。
  不在 initialize 中全域設定 layout：mindmap 等圖種使用自己的排版引擎，全域指定 ELK 會讓它們 render 失敗。
  需要指定排版時，寫在各圖原始碼開頭的 front matter。
-->
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-VFr1YTH7QPs4a428eXCrUwbzpEQ+vEina/dqzu5x9h8=' https://cdn.jsdelivr.net/npm/mermaid@12.1.0/; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #F7F7F8; --surface: #FFFFFF; --text: #1F2328; --muted: #59636E;
    --border: #D1D9E0; --control: #EFF2F5; --control-text: #1F2328; --control-active: #FFFFFF;
    --danger: #A32D2D; --danger-bg: #FCEBEB; --warn: #854F0B; --warn-bg: #FAEEDA;
    --canvas-light: #FFFFFF; --canvas-dark: #1B1B1F;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Hiragino Sans", "Noto Sans TC", "Noto Sans JP", "Microsoft JhengHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151518; --surface: #1F1F23; --text: #E8E8EA; --muted: #A0A0A8;
      --border: #3A3A40; --control: #2A2A2F; --control-text: #E8E8EA; --control-active: #44444B;
      --danger: #F7C1C1; --danger-bg: #501313; --warn: #FAC775; --warn-bg: #412402;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151518; --surface: #1F1F23; --text: #E8E8EA; --muted: #A0A0A8;
    --border: #3A3A40; --control: #2A2A2F; --control-text: #E8E8EA; --control-active: #44444B;
    --danger: #F7C1C1; --danger-bg: #501313; --warn: #FAC775; --warn-bg: #412402;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 var(--font); }
  .page { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  :root[data-width="wide"] .page { max-width: none; padding-left: 24px; padding-right: 24px; }
  header .summary, .diagram .caption, .legend { max-width: 80ch; }
  .page.has-toc { display: grid; grid-template-columns: 220px minmax(0, 1fr); column-gap: 24px; align-items: start; }
  .page.has-toc > header, .page.has-toc > #status { grid-column: 1 / -1; }
  .toc { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; font-size: 14px; }
  .toc summary { cursor: pointer; color: var(--muted); margin: 0 0 8px; }
  .toc ol { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--border); }
  .toc a { display: block; padding: 4px 10px; margin-left: -1px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; }
  .toc a:hover { color: var(--text); }
  .toc a[aria-current="true"] { color: var(--text); border-left-color: var(--text); font-weight: 600; }
  @media (min-width: 1200px) { .toc summary { display: none; } }
  @media (max-width: 1199px) {
    .page.has-toc { display: block; }
    .toc { position: static; max-height: none; margin: 0 0 24px; }
  }
  section.diagram { scroll-margin-top: 16px; }
  header { margin: 0 0 24px; }
  header h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  header .summary { color: var(--muted); margin: 0; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0 0; }
  .segmented { display: inline-flex; background: var(--control); border-radius: 6px; padding: 2px; }
  .segmented button { font: 13px var(--font); color: var(--control-text); background: transparent; border: 0; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  .segmented button[aria-pressed="true"] { background: var(--control-active); box-shadow: 0 0 0 1px var(--border); }
  .controls select { font: 13px var(--font); color: var(--control-text); background: var(--control); border: 0; border-radius: 6px; padding: 4px 8px; }
  #status { margin: 0 0 24px; padding: 10px 14px; border-radius: 8px; font-size: 14px; display: none; }
  #status.show { display: block; }
  #status.warn { background: var(--warn-bg); color: var(--warn); }
  #status.error { background: var(--danger-bg); color: var(--danger); }
  .diagram { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin: 0 0 24px; }
  .diagram h2 { font-size: 18px; font-weight: 600; margin: 0 0 2px; }
  .diagram .caption { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
  .toolbar button { font: 13px var(--font); color: var(--control-text); background: var(--control); border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .toolbar button:hover { opacity: .85; }
  .toolbar .zoom { display: inline-flex; gap: 2px; }
  .toolbar select { font: 13px var(--font); color: var(--control-text); background: var(--control); border: 0; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  .toolbar .zoom .level { min-width: 56px; font-variant-numeric: tabular-nums; }
  .canvas { overflow: auto; border-radius: 8px; padding: 12px; background: var(--canvas-light); touch-action: pan-x pan-y; }
  .canvas.dark { background: var(--canvas-dark); }
  .canvas.zoomed { max-height: 80vh; cursor: grab; }
  .canvas.dragging { cursor: grabbing; user-select: none; }
  .canvas svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
  .legend { margin: 12px 0 0; padding: 12px 14px; border-top: 1px solid var(--border); font-size: 14px; color: var(--muted); }
  .legend ul { margin: 0; padding-left: 20px; }
  details.legend-box .legend { margin: 8px 0 0; padding: 0; border-top: 0; }
  .err { background: var(--danger-bg); color: var(--danger); border-radius: 8px; padding: 12px 14px; font-size: 14px; }
  .err pre, details pre { font: 13px/1.5 var(--mono); white-space: pre-wrap; margin: 8px 0 0; }
  details { margin: 12px 0 0; font-size: 14px; }
  details summary { cursor: pointer; color: var(--muted); }
  details pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text); }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>{{TITLE}}</h1>
    <p class="summary">{{SUMMARY}}</p>
    <div class="controls" id="controls"></div>
  </header>
  <div id="status" role="status"></div>
  <main>

    <section class="diagram">
      <h2>{{DIAGRAM_TITLE}}</h2>
      <p class="caption">{{DIAGRAM_CAPTION}}</p>
      <script type="text/plain" class="mermaid-src">
{{MERMAID_SOURCE}}
      </script>
      <div class="legend">{{LEGEND}}</div>
    </section>

  </main>
</div>

<script type="module">
const MERMAID_URL = 'https://cdn.jsdelivr.net/npm/mermaid@12.1.0/dist/mermaid.esm.min.mjs';
const THEMES = ['redux-color', 'redux-dark-color', 'redux', 'redux-dark', 'default', 'dark', 'neo', 'neo-dark', 'forest', 'neutral'];
const AUTO_THEME = { light: 'redux-color', dark: 'redux-dark-color' };
const STORE = { mode: 'diagram-first:mode', theme: 'diagram-first:theme', direction: 'diagram-first:direction', width: 'diagram-first:width' };
const ZOOM = { min: 0.25, max: 4, step: 1.25 };

const I18N = {
  zh: { copy: '複製原始碼', copied: '已複製', svg: '下載 SVG', source: 'Mermaid 原始碼',
        mode: '模式', theme: 'Theme', auto: '自動', light: '淺色', dark: '深色',
        direction: '方向', vertical: '垂直', horizontal: '水平',
        zoomIn: '放大', zoomOut: '縮小', zoomActual: '原始大小', reset: '重設',
        width: '寬度', wide: '寬版', standard: '標準', toc: '目錄', legend: '圖例',
        download: '下載…', transparent: 'PNG（透明背景）', copyImage: '複製圖片', copyFail: '無法複製', exportFail: '匯出失敗',
        loadFail: '無法載入 Mermaid，請確認網路連線後重新整理頁面。', parseFail: '語法錯誤，這張圖無法 render：',
        renderFail: 'Render 失敗：', some: (ok, bad) => `${ok} 張成功、${bad} 張失敗。請把錯誤訊息回報給 Agent。`,
        noElk: 'ELK 排版未生效，圖形以預設的 dagre 排版顯示。請回報給 Agent。' },
  en: { copy: 'Copy source', copied: 'Copied', svg: 'Download SVG', source: 'Mermaid source',
        mode: 'Mode', theme: 'Theme', auto: 'Auto', light: 'Light', dark: 'Dark',
        direction: 'Direction', vertical: 'Vertical', horizontal: 'Horizontal',
        zoomIn: 'Zoom in', zoomOut: 'Zoom out', zoomActual: 'Actual size', reset: 'Reset',
        width: 'Width', wide: 'Wide', standard: 'Standard', toc: 'Contents', legend: 'Legend',
        download: 'Download…', transparent: 'PNG (transparent)', copyImage: 'Copy image', copyFail: 'Copy failed', exportFail: 'Export failed',
        loadFail: 'Could not load Mermaid. Check your network connection and reload the page.', parseFail: 'Syntax error, this diagram could not be rendered:',
        renderFail: 'Render failed:', some: (ok, bad) => `${ok} succeeded, ${bad} failed. Please report the error to the agent.`,
        noElk: 'ELK layout is not active; diagrams fell back to dagre. Please report this to the agent.' },
  ja: { copy: 'ソースをコピー', copied: 'コピーしました', svg: 'SVG をダウンロード', source: 'Mermaid ソース',
        mode: 'モード', theme: 'テーマ', auto: '自動', light: 'ライト', dark: 'ダーク',
        direction: '方向', vertical: '縦', horizontal: '横',
        zoomIn: '拡大', zoomOut: '縮小', zoomActual: '原寸', reset: 'リセット',
        width: '幅', wide: 'ワイド', standard: '標準', toc: '目次', legend: '凡例',
        download: 'ダウンロード…', transparent: 'PNG（透過）', copyImage: '画像をコピー', copyFail: 'コピーできません', exportFail: '書き出しに失敗しました',
        loadFail: 'Mermaid を読み込めません。ネットワーク接続を確認して再読み込みしてください。', parseFail: '構文エラーのため描画できません：',
        renderFail: '描画に失敗しました：', some: (ok, bad) => `${ok} 枚成功、${bad} 枚失敗。エラーをエージェントに報告してください。`,
        noElk: 'ELK レイアウトが有効になっていません（dagre で表示）。エージェントに報告してください。' },
};
const lang = (document.documentElement.lang || 'zh').toLowerCase();
const T = I18N[lang.slice(0, 2)] || I18N.en;

const statusEl = document.getElementById('status');
function setStatus(kind, text) {
  statusEl.className = 'show ' + kind;
  statusEl.textContent = text;
}

function load(key, allowed, fallback) {
  try {
    const v = localStorage.getItem(key);
    return allowed.includes(v) ? v : fallback;
  } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}

const systemDark = matchMedia('(prefers-color-scheme: dark)');
let mode = load(STORE.mode, ['auto', 'light', 'dark'], 'auto');
let theme = load(STORE.theme, ['auto', ...THEMES], 'auto');
const landscape = matchMedia('(orientation: landscape)');
let direction = load(STORE.direction, ['auto', 'vertical', 'horizontal'], 'auto');
let width = load(STORE.width, ['wide', 'standard'], 'wide');
function applyWidth() { document.documentElement.dataset.width = width; }
applyWidth();

function isDark() {
  return mode === 'dark' || (mode === 'auto' && systemDark.matches);
}
function applyMode() {
  if (mode === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = mode;
}
function currentTheme() {
  return theme === 'auto' ? AUTO_THEME[isDark() ? 'dark' : 'light'] : theme;
}
applyMode();

function dedent(text) {
  const lines = text.replace(/\t/g, '    ').split('\n');
  while (lines.length && !lines[0].trim()) lines.shift();
  while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
  const indents = lines.filter((l) => l.trim()).map((l) => l.match(/^ */)[0].length);
  const min = indents.length ? Math.min(...indents) : 0;
  return lines.map((l) => l.slice(min)).join('\n');
}

const DIRECTED = /^(flowchart(-elk)?|graph|stateDiagram(-v2)?|classDiagram(-v2)?|erDiagram|requirementDiagram)(?=[\s;]|$)/;
const DIR = '(TB|TD|BT|LR|RL)';

// 依方向設定改寫整張圖的方向；只處理有方向設定的圖種，subgraph 等區塊內的 direction 不動。
function withDirection(source) {
  if (direction === 'auto' && !landscape.matches) return source;
  const lines = source.split('\n');
  let k = 0;
  if (lines[0].trim() === '---') {
    const end = lines.findIndex((l, n) => n > 0 && l.trim() === '---');
    if (end < 0) return source;
    k = end + 1;
  }
  while (k < lines.length && (!lines[k].trim() || lines[k].trim().startsWith('%%'))) k++;
  const header = (lines[k] || '').trim();
  const type = header.match(DIRECTED);
  if (!type) return source;

  const flow = /^(flowchart|graph)/.test(type[1]);
  let author = 'TB';
  let at = -1;
  if (flow) {
    const m = header.match(new RegExp('^\\S+\\s+' + DIR + '(?=[\\s;]|$)'));
    if (m) author = m[1];
  } else {
    let depth = 0;
    for (let n = k + 1; n < lines.length; n++) {
      const m = depth === 0 && lines[n].match(new RegExp('^\\s*direction\\s+' + DIR + '\\s*$'));
      if (m) { author = m[1]; at = n; break; }
      depth += (lines[n].match(/\{/g) || []).length - (lines[n].match(/\}/g) || []).length;
    }
  }

  const horizontal = author === 'LR' || author === 'RL';
  if (direction === 'auto' && horizontal) return source;
  if (direction === 'vertical' && !horizontal) return source;
  if (direction === 'horizontal' && horizontal) return source;
  const target = direction === 'vertical' ? 'TB' : 'LR';

  if (flow) {
    lines[k] = lines[k].replace(new RegExp('^(\\s*\\S+)(\\s+' + DIR + ')?(?=[\\s;]|$)'), `$1 ${target}`);
  } else if (at >= 0) {
    lines[at] = lines[at].replace(new RegExp(DIR), target);
  } else {
    lines.splice(k + 1, 0, `  direction ${target}`);
  }
  return lines.join('\n');
}

function el(tag, attrs = {}, text) {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  if (text !== undefined) node.textContent = text;
  return node;
}

async function elkIsActive(mermaid) {
  const body = 'flowchart LR\n  A --> B\n  A --> C\n  B --> D\n  C --> D\n  A --> D';
  try {
    const a = await mermaid.render('probe-elk', '---\nconfig:\n  layout: elk\n---\n' + body);
    const b = await mermaid.render('probe-dagre', '---\nconfig:\n  layout: dagre\n---\n' + body);
    const strip = (s, id) => s.split(id).join('X');
    return strip(a.svg, 'probe-elk') !== strip(b.svg, 'probe-dagre');
  } catch {
    return false;
  }
}

let mermaid;
try {
  ({ default: mermaid } = await import(MERMAID_URL));
} catch (e) {
  setStatus('error', T.loadFail);
  throw e;
}

const font = getComputedStyle(document.documentElement).getPropertyValue('--font').trim();
await document.fonts.ready;
function initMermaid() {
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: 'strict',
    theme: currentTheme(),
    fontFamily: font,
    themeVariables: { fontFamily: font },
  });
}

function viewWidth(d) {
  const svg = d.canvas.querySelector('svg');
  const vb = svg && svg.viewBox && svg.viewBox.baseVal;
  return vb && vb.width ? vb.width : 0;
}
function currentScale(d) {
  const svg = d.canvas.querySelector('svg');
  const w = viewWidth(d);
  return svg && w ? svg.getBoundingClientRect().width / w : 1;
}
function showLevel(d) {
  if (d.ok) d.level.textContent = `${Math.round(currentScale(d) * 100)}%`;
}

// scale 為 null 時符合寬度；anchor 為縮放時保持不動的螢幕座標。
function setZoom(d, scale, anchor) {
  const svg = d.canvas.querySelector('svg');
  const w = viewWidth(d);
  if (!svg || !w) return;
  const before = svg.getBoundingClientRect();
  if (scale === null) {
    if (d.baseStyle === null) svg.removeAttribute('style');
    else svg.setAttribute('style', d.baseStyle);
    d.canvas.classList.remove('zoomed');
  } else {
    scale = Math.min(ZOOM.max, Math.max(ZOOM.min, scale));
    svg.style.maxWidth = 'none';
    svg.style.width = `${w * scale}px`;
    d.canvas.classList.add('zoomed');
  }
  d.scale = scale;
  if (anchor) {
    const rx = (anchor.x - before.left) / before.width;
    const ry = (anchor.y - before.top) / before.height;
    const after = svg.getBoundingClientRect();
    d.canvas.scrollLeft += after.left + rx * after.width - anchor.x;
    d.canvas.scrollTop += after.top + ry * after.height - anchor.y;
  }
  showLevel(d);
}

function bindGestures(d) {
  const c = d.canvas;
  c.addEventListener('wheel', (e) => {
    if (!d.ok || !(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    // 觸控板捏合送出小幅、連續的 deltaY；滑鼠滾輪每格以固定倍率縮放。
    const pinch = e.deltaMode === 0 && Math.abs(e.deltaY) < 50;
    const factor = pinch ? Math.exp(-e.deltaY * 0.01) : e.deltaY < 0 ? ZOOM.step : 1 / ZOOM.step;
    setZoom(d, currentScale(d) * factor, { x: e.clientX, y: e.clientY });
  }, { passive: false });
  let gestureBase = 1;
  c.addEventListener('gesturestart', (e) => { e.preventDefault(); gestureBase = currentScale(d); });
  c.addEventListener('gesturechange', (e) => {
    if (!d.ok) return;
    e.preventDefault();
    setZoom(d, gestureBase * e.scale, { x: e.clientX, y: e.clientY });
  });
  let drag = null;
  c.addEventListener('pointerdown', (e) => {
    if (d.scale === null || e.pointerType !== 'mouse' || e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, left: c.scrollLeft, top: c.scrollTop };
    c.setPointerCapture(e.pointerId);
    c.classList.add('dragging');
  });
  c.addEventListener('pointermove', (e) => {
    if (!drag) return;
    c.scrollLeft = drag.left - (e.clientX - drag.x);
    c.scrollTop = drag.top - (e.clientY - drag.y);
  });
  const end = () => { drag = null; c.classList.remove('dragging'); };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);
}

// 把 SVG 轉成點陣圖。含 foreignObject 的 SVG 在部分瀏覽器會污染 canvas，此時改用純 SVG 文字標籤重新 render。
async function rasterize(svgText, type, background) {
  const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
  const root = doc.documentElement;
  const vb = (root.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
  if (vb.length !== 4 || !vb[2]) throw new Error('no viewBox');
  root.setAttribute('width', vb[2]);
  root.setAttribute('height', vb[3]);
  root.removeAttribute('style');
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(root));
  await img.decode();
  const ratio = 2;
  const c = document.createElement('canvas');
  c.width = Math.ceil(vb[2] * ratio);
  c.height = Math.ceil(vb[3] * ratio);
  const g = c.getContext('2d');
  if (background) { g.fillStyle = background; g.fillRect(0, 0, c.width, c.height); }
  g.drawImage(img, 0, 0, c.width, c.height);
  return new Promise((resolve, reject) => c.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob'))), type, 0.92));
}
async function exportImage(d, type, transparent) {
  const background = transparent ? null : getComputedStyle(d.canvas).backgroundColor;
  try {
    return await rasterize(d.svg, type, background);
  } catch (e) {
    if (e.name !== 'SecurityError') throw e;
    mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: currentTheme(), fontFamily: font,
      themeVariables: { fontFamily: font }, htmlLabels: false, flowchart: { htmlLabels: false } });
    try {
      const { svg } = await mermaid.render(`export-${d.i}-${Date.now()}`, withDirection(d.source));
      return await rasterize(svg, type, background);
    } finally {
      initMermaid();
    }
  }
}
function saveBlob(blob, name) {
  const a = el('a', { href: URL.createObjectURL(blob), download: name });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const probe = document.createElement('canvas');
const FORMATS = [['svg', 'SVG'], ['png', 'PNG'], ['png-transparent', null], ['jpeg', 'JPEG']];
if (probe.toDataURL('image/webp').startsWith('data:image/webp')) FORMATS.push(['webp', 'WebP']);

const diagrams = [];
let badCount = 0;

for (const [i, section] of [...document.querySelectorAll('section.diagram')].entries()) {
  const srcNode = section.querySelector('script.mermaid-src');
  if (!srcNode) continue;
  const source = dedent(srcNode.textContent);

  const toolbar = el('div', { class: 'toolbar' });
  const canvas = el('div', { class: 'canvas' });
  const details = el('details');
  details.append(el('summary', {}, T.source), el('pre', {}, source));
  srcNode.after(toolbar, canvas);
  const legend = section.querySelector('.legend');
  if (legend) {
    const items = legend.querySelectorAll('li').length;
    const box = el('details', { class: 'legend-box' });
    box.append(el('summary', {}, items ? `${T.legend} (${items})` : T.legend));
    legend.replaceWith(box);
    box.append(legend);
    box.after(details);
  } else {
    canvas.after(details);
  }

  const copyBtn = el('button', { type: 'button' }, T.copy);
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(source);
      copyBtn.textContent = T.copied;
      setTimeout(() => { copyBtn.textContent = T.copy; }, 1500);
    } catch { details.open = true; }
  });
  toolbar.append(copyBtn);

  try {
    await mermaid.parse(source);
  } catch (e) {
    badCount++;
    const box = el('div', { class: 'err' }, T.parseFail);
    box.append(el('pre', {}, String(e.message || e)));
    canvas.append(box);
    details.open = true;
    continue;
  }

  const d = { i, section, source, canvas, details, toolbar, ok: false, svg: '', scale: null, baseStyle: null };
  const downloadSelect = el('select', { 'aria-label': T.download });
  downloadSelect.append(el('option', { value: '' }, T.download));
  FORMATS.forEach(([v, label]) => downloadSelect.append(el('option', { value: v }, label || T.transparent)));
  downloadSelect.addEventListener('change', async () => {
    const v = downloadSelect.value;
    downloadSelect.value = '';
    if (!v) return;
    const name = `diagram-${i + 1}`;
    try {
      if (v === 'svg') saveBlob(new Blob([d.svg], { type: 'image/svg+xml' }), `${name}.svg`);
      else {
        const type = v === 'png-transparent' ? 'image/png' : `image/${v}`;
        const ext = v === 'jpeg' ? 'jpg' : v === 'png-transparent' ? 'png' : v;
        saveBlob(await exportImage(d, type, v === 'png-transparent'), `${name}.${ext}`);
      }
    } catch (e) {
      downloadSelect.options[0].textContent = T.exportFail;
      setTimeout(() => { downloadSelect.options[0].textContent = T.download; }, 2000);
    }
  });
  const copyImgBtn = el('button', { type: 'button' }, T.copyImage);
  copyImgBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': exportImage(d, 'image/png', false) })]);
      copyImgBtn.textContent = T.copied;
    } catch {
      copyImgBtn.textContent = T.copyFail;
    }
    setTimeout(() => { copyImgBtn.textContent = T.copyImage; }, 1500);
  });
  const zoom = el('div', { class: 'zoom', role: 'group' });
  const outBtn = el('button', { type: 'button', 'aria-label': T.zoomOut, title: T.zoomOut }, '−');
  d.level = el('button', { type: 'button', class: 'level', title: T.zoomActual }, '');
  const inBtn = el('button', { type: 'button', 'aria-label': T.zoomIn, title: T.zoomIn }, '+');
  const resetBtn = el('button', { type: 'button' }, T.reset);
  outBtn.addEventListener('click', () => setZoom(d, currentScale(d) / ZOOM.step));
  inBtn.addEventListener('click', () => setZoom(d, currentScale(d) * ZOOM.step));
  d.level.addEventListener('click', () => setZoom(d, 1));
  resetBtn.addEventListener('click', () => setZoom(d, null));
  zoom.append(outBtn, d.level, inBtn);
  d.buttons = [downloadSelect, copyImgBtn, zoom, resetBtn];
  bindGestures(d);
  diagrams.push(d);
}

let renderCount = 0;
async function renderAll() {
  const name = currentTheme();
  initMermaid();
  renderCount++;
  for (const d of diagrams) {
    d.canvas.classList.toggle('dark', name.includes('dark'));
    try {
      const source = withDirection(d.source);
      let svg;
      try {
        ({ svg } = await mermaid.render(`diagram-${d.i}-${renderCount}`, source));
      } catch (e) {
        if (source === d.source) throw e;
        ({ svg } = await mermaid.render(`diagram-${d.i}-${renderCount}-src`, d.source));
      }
      d.svg = svg;
      d.canvas.innerHTML = svg;
      d.baseStyle = d.canvas.querySelector('svg')?.getAttribute('style') ?? null;
      if (!d.ok) d.toolbar.append(...d.buttons);
      d.ok = true;
      if (d.scale === null) showLevel(d);
      else setZoom(d, d.scale);
    } catch (e) {
      const box = el('div', { class: 'err' }, T.renderFail);
      box.append(el('pre', {}, String(e.message || e)));
      d.canvas.replaceChildren(box);
      d.buttons.forEach((b) => b.remove());
      d.ok = false;
      d.details.open = true;
    }
  }
}

const controls = document.getElementById('controls');
const modeGroup = el('div', { class: 'segmented', role: 'group', 'aria-label': T.mode });
const modeButtons = ['auto', 'light', 'dark'].map((m) => {
  const b = el('button', { type: 'button', 'aria-pressed': String(m === mode) }, T[m]);
  b.addEventListener('click', async () => {
    mode = m;
    save(STORE.mode, m);
    modeButtons.forEach((x, k) => x.setAttribute('aria-pressed', String(['auto', 'light', 'dark'][k] === m)));
    applyMode();
    if (theme === 'auto') await renderAll();
  });
  return b;
});
modeGroup.append(...modeButtons);
const themeSelect = el('select', { 'aria-label': T.theme });
themeSelect.append(el('option', { value: 'auto' }, `${T.auto} (${AUTO_THEME.light} / ${AUTO_THEME.dark})`));
THEMES.forEach((t) => themeSelect.append(el('option', { value: t }, t)));
themeSelect.value = theme;
themeSelect.addEventListener('change', async () => {
  theme = themeSelect.value;
  save(STORE.theme, theme);
  await renderAll();
});
const DIRECTIONS = ['auto', 'vertical', 'horizontal'];
const directionGroup = el('div', { class: 'segmented', role: 'group', 'aria-label': T.direction });
const directionButtons = DIRECTIONS.map((v) => {
  const b = el('button', { type: 'button', 'aria-pressed': String(v === direction) }, T[v]);
  b.addEventListener('click', async () => {
    direction = v;
    save(STORE.direction, v);
    directionButtons.forEach((x, k) => x.setAttribute('aria-pressed', String(DIRECTIONS[k] === v)));
    await renderAll();
  });
  return b;
});
directionGroup.append(...directionButtons);
const WIDTHS = ['wide', 'standard'];
const widthGroup = el('div', { class: 'segmented', role: 'group', 'aria-label': T.width });
const widthButtons = WIDTHS.map((v) => {
  const b = el('button', { type: 'button', 'aria-pressed': String(v === width) }, T[v]);
  b.addEventListener('click', () => {
    width = v;
    save(STORE.width, v);
    widthButtons.forEach((x, k) => x.setAttribute('aria-pressed', String(WIDTHS[k] === v)));
    applyWidth();
    diagrams.forEach((d) => { if (d.scale === null) showLevel(d); });
  });
  return b;
});
widthGroup.append(...widthButtons);
controls.append(modeGroup, directionGroup, widthGroup, themeSelect);

const sections = [...document.querySelectorAll('section.diagram')];
if (sections.length >= 2) {
  const nav = el('nav', { class: 'toc', 'aria-label': T.toc });
  const box = el('details');
  const list = el('ol');
  const links = new Map();
  sections.forEach((section, k) => {
    if (!section.id) section.id = `diagram-${k + 1}`;
    const title = section.querySelector('h2')?.textContent.trim() || `#${k + 1}`;
    const a = el('a', { href: `#${section.id}` }, title);
    links.set(section, a);
    const li = el('li');
    li.append(a);
    list.append(li);
  });
  box.append(el('summary', {}, T.toc), list);
  nav.append(box);
  const page = document.querySelector('.page');
  page.classList.add('has-toc');
  document.querySelector('main').before(nav);
  const wideToc = matchMedia('(min-width: 1200px)');
  const syncToc = () => { if (wideToc.matches) box.open = true; };
  syncToc();
  wideToc.addEventListener('change', syncToc);
  const visible = new Set();
  const spy = new IntersectionObserver((entries) => {
    entries.forEach((e) => (e.isIntersecting ? visible.add(e.target) : visible.delete(e.target)));
    const current = sections.find((x) => visible.has(x));
    links.forEach((a, x) => a.setAttribute('aria-current', String(x === current)));
  }, { rootMargin: '0px 0px -60% 0px' });
  sections.forEach((x) => spy.observe(x));
}

systemDark.addEventListener('change', async () => {
  if (mode === 'auto' && theme === 'auto') await renderAll();
});
landscape.addEventListener('change', async () => {
  if (direction === 'auto') await renderAll();
});
addEventListener('resize', () => diagrams.forEach((d) => { if (d.scale === null) showLevel(d); }));

await renderAll();
badCount += diagrams.filter((d) => !d.ok).length;

if (badCount) {
  setStatus('error', T.some(diagrams.filter((d) => d.ok).length, badCount));
} else if (!(await elkIsActive(mermaid))) {
  setStatus('warn', T.noElk);
}
</script>
</body>
</html>
